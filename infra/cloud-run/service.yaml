apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: daily-news-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    spec:
      serviceAccountName: ${API_RUNTIME_SERVICE_ACCOUNT}
      containers:
        - image: ${IMAGE_URI}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: ALLOWED_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ALLOWED_USER_EMAIL
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: DATABASE_URL
                  key: latest
