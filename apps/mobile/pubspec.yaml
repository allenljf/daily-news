publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  firebase_auth: ^6.1.4
  firebase_core: ^4.2.1
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.1
  json_annotation: ^4.9.0

dev_dependencies:
  build_runner: ^2.10.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true
