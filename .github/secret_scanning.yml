# Firebase client configuration is public client configuration, not a secret
# (see infra/docs/secret-inventory.md). Both files below carry the Firebase
# client API key, which Google defines as a project identifier that ships inside
# every app binary and is therefore readable by anyone holding the app.
#
# The real protection is the API key restriction configured in Google Cloud
# Console (Android package name + SHA-1, iOS bundle ID, and the allowed APIs),
# not keeping the value out of the repository.
#
# Excluding these paths stops secret scanning from raising google_api_key alerts
# for every Firebase client config in the repository.
paths-ignore:
  - "apps/mobile/android/app/google-services.json"
  - "apps/mobile/ios/Runner/GoogleService-Info.plist"
