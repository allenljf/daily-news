- id: riverpod-ref-stays-in-presentation
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 03-dependency-injection.md
  check: regex
  pattern: \bRef\b
  applies_to:
    - 'lib/**/data/**/*.dart'
    - 'lib/**/domain/**/*.dart'
    - 'packages/**/lib/**/*.dart'
  exclude:
    - '**/presentation/**'
    - '**/ui/**'
    - '**/test/**'
    - '**/*_test.dart'
  message: Riverpod 的 Ref 只留在 composition root 與 presentation。Repository、service、use case 一律走建構子注入。
  source: https://riverpod.dev/docs/how_to/testing
- id: buildcontext-not-in-viewmodel
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 03-dependency-injection.md
  check: regex
  pattern: \bBuildContext\b
  applies_to:
    - '*view_model.dart'
    - '*controller.dart'
    - '*notifier.dart'
  exclude:
    - '**/test/**'
    - '**/*_test.dart'
  message: ViewModel 不持有 BuildContext。導航、SnackBar、Dialog 等 UI side effect 留在 View 或 effect handler。
  source: https://docs.flutter.dev/app-architecture/case-study/dependency-injection
- id: provider-overrides-enable-fakes
  level: MUST
  enforce: new-only
  owner: 03-dependency-injection.md
  check: manual
  source: https://riverpod.dev/docs/how_to/testing

