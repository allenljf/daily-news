# Flutter 開發準則 — 機器可讀規則索引（唯一真相源）
# guides/*.md 是這份的人類可讀版本。改規則要同步兩邊。
#
# level:   MUST / MUST_NOT / SHOULD / SHOULD_NOT / MAY
# enforce: new-only / new-only+on-touch / migrate / exempt
# check:   regex（需 pattern 欄位）/ file（需 file_check）/ manual

- id: single-source-of-truth
  level: MUST
  enforce: new-only+on-touch
  owner: 00-principles.md
  check: manual
  source: https://docs.flutter.dev/app-architecture/concepts
- id: immutable-public-state
  level: MUST
  enforce: new-only+on-touch
  owner: 00-principles.md
  check: manual
  source: https://docs.flutter.dev/app-architecture/concepts
- id: unidirectional-data-flow
  level: MUST
  enforce: new-only+on-touch
  owner: 00-principles.md
  check: manual
  source: https://docs.flutter.dev/app-architecture/concepts

- id: widget-reads-repository
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 01-architecture.md
  check: regex
  pattern: \b(?:final|late\s+final|var)\s+\w*Repository\b|\bref\.(?:watch|read)\([^)]*Repository
  applies_to:
    - '*screen.dart'
    - '*page.dart'
    - '*view.dart'
    - '*widget.dart'
  exclude:
    - '**/test/**'
    - '**/*_test.dart'
  message: Widget 只讀 ViewModel 或 presentation provider，不直接讀 Repository。把資料存取與 refresh 指令移到 ViewModel。
  source: https://docs.flutter.dev/app-architecture/guide
- id: viewmodel-accesses-service
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 01-architecture.md
  check: regex
  pattern: \b(?:final|late\s+final|var)\s+\w*(?:Service|Client|Api|Dio|Database|Drift|SharedPreferences(?:Async|WithCache)?)\b
  applies_to:
    - '*view_model.dart'
    - '*controller.dart'
    - '*notifier.dart'
  exclude:
    - '**/test/**'
    - '**/*_test.dart'
  message: ViewModel 只依賴 Repository 或 UseCase，不直接持有 service、Dio、SQLite 或 shared_preferences。
  source: https://docs.flutter.dev/app-architecture/guide
- id: layer-models-do-not-cross
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 01-architecture.md
  check: manual
  source: https://docs.flutter.dev/app-architecture/data-layer

