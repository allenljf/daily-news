- id: dio-outside-remote-service
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 06-network.md
  check: regex
  pattern: \bDio\b
  applies_to:
    - '**/*.dart'
  exclude:
    - '**/remote/**'
    - '**/*remote_service.dart'
    - '**/*api_service.dart'
    - '**/*client.dart'
    - '**/test/**'
    - '**/*_test.dart'
  message: Dio 只能存在 remote service 或 API client。其他層改依賴 repository 介面或純 DTO mapper。
  source: https://pub.dev/packages/dio
