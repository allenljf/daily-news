- id: domain-is-pure-dart
  level: MUST
  enforce: new-only+on-touch
  owner: 04-domain-layer.md
  check: regex
  pattern: ^import\s+'package:(?:flutter|flutter_riverpod|hooks_riverpod|dio|sqflite|drift|shared_preferences)/
  applies_to:
    - 'lib/**/domain/**/*.dart'
    - 'packages/**/lib/**/domain/**/*.dart'
  exclude:
    - '**/test/**'
    - '**/*_test.dart'
  message: Domain 層只放純 Dart 商業規則，不 import Flutter、Riverpod、Dio、SQLite 或 shared_preferences。
  source: https://docs.flutter.dev/app-architecture/guide
- id: domain-does-not-format-ui-copy
