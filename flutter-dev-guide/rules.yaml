- id: local-storage-stays-behind-service
  level: MUST_NOT
  enforce: new-only+on-touch
  owner: 07-persistence.md
  check: regex
  pattern: \b(?:Database|GeneratedDatabase|QueryExecutor|DriftDatabase|SharedPreferences(?:Async|WithCache)?)\b
  applies_to:
    - '*view_model.dart'
    - '*controller.dart'
    - '*notifier.dart'
    - '*screen.dart'
    - '*page.dart'
    - '*view.dart'
    - '*widget.dart'
  exclude:
    - '**/test/**'
    - '**/*_test.dart'
  message: Widget 與 ViewModel 不直接持有 SQLite、Drift 或 shared_preferences。改由 repository 經 local service 提供。
  source: https://docs.flutter.dev/app-architecture/design-patterns/sql
